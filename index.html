<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA</title>
    <script src="JS/alumnos.js" defer></script>
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <header>
        <h1>Sistema de Gestion Academica</h1>
    </header>

    <main>
        <section class="formulario">
            <h2>Proyecto de Programacion IV</h2>

            <form id="formAlumno">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre"><br><br>

                <label for="carrera">Carrera</label>
                <input type="text" id="carrera"><br><br>

                <label for="correo">Correo</label>
                <input type="text" id="correo"><br><br>

                <button type="submit">Guardar</button>

            </form>

            <p id="mensaje" class="oculto"> </p>

        </section>



        <section class="alumnos">
            <h2>Alumnos registrados</h2>
            <p id="cantidadAlumnos"></p>
            <!-- <ul id="listaAlumnos"></ul> -->
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Carrera</th>
                        <th>Correo</th>
                        <th>Accines</th>

                    </tr>
                </thead>
                <tbody id="listaAlumnos"></tbody>
            </table>
        </section>


    </main>
</body>

</html>
